<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>A4 Landscape PDF Converter</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px 16px;
      max-width: 480px;
      margin: 0 auto;
      background-color: #f2f2f7;
      color: #1c1c1e;
    }
    .card {
      background: #ffffff;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }
    h2 {
      margin-top: 0;
      font-size: 20px;
    }
    p {
      color: #636366;
      font-size: 14px;
      line-height: 1.4;
    }
    input[type="file"] {
      margin: 20px 0;
      width: 100%;
      font-size: 14px;
    }
    button {
      background-color: #007aff;
      color: white;
      border: none;
      padding: 16px;
      width: 100%;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled {
      background-color: #aeaeb2;
    }
    #status {
      margin-top: 18px;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Table Screenshot to A4 PDF</h2>
    <p>Upload a cropped screenshot of your table. It will scale to fit an A4 Landscape page perfectly.</p>
    
    <input type="file" id="imageInput" accept="image/*">
    <button id="convertBtn" onclick="processImage()">Convert & Download PDF</button>
    
    <div id="status"></div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxXylY8J3qSY9AuCQk10PYeS-xlyxoHLbRvJx8UIs1ysLK5GwyYLq7Mlh5RHF6DihKL/exec";

    async function processImage() {
      const fileInput = document.getElementById('imageInput');
      const status = document.getElementById('status');
      const btn = document.getElementById('convertBtn');

      if (!fileInput.files[0]) {
        alert("Please select or take a screenshot first.");
        return;
      }

      btn.disabled = true;
      status.style.color = "#007aff";
      status.innerText = "Processing & scaling image...";

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onload = async function(e) {
        const base64Image = e.target.result;

        try {
          const response = await fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({
              imageData: base64Image
            })
          });

          const result = await response.json();

          if (result.status === 'success') {
            status.style.color = "#34c759";
            
            // Convert base64 PDF into a Blob URL for iOS Safari compatibility
            const byteCharacters = atob(result.pdfBase64);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) {
              byteNumbers[i] = byteCharacters.charCodeAt(i);
            }
            const byteArray = new Uint8Array(byteNumbers);
            const blob = new Blob([byteArray], { type: 'application/pdf' });
            const blobUrl = URL.createObjectURL(blob);

            // Display an explicit tap button for iOS Safari
            status.innerHTML = `
              <p style="margin-bottom: 12px; color: #1c1c1e; font-weight: 600;">PDF Ready!</p>
              <a href="${blobUrl}" target="_blank" style="
                display: block;
                background-color: #34c759;
                color: white;
                text-decoration: none;
                padding: 14px;
                border-radius: 10px;
                font-weight: bold;
                text-align: center;
              ">Tap to View / Print PDF</a>
            `;
          } else {
            status.style.color = "#ff3b30";
            status.innerText = "Error: " + result.message;
          }
        } catch (err) {
          status.style.color = "#ff3b30";
          status.innerText = "Conversion failed. Please verify Web App URL.";
        } finally {
          btn.disabled = false;
        }
      };

      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
